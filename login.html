<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; }
    .login-box { text-align:center; }
    input { padding:8px; font-size:16px; margin-top:10px; }
    button { padding:8px 12px; font-size:16px; margin-left:5px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Enter Password</h2>
    <input type="password" id="password" placeholder="Password">
    <button onclick="checkPassword()">Enter</button>
    <p id="error" style="color:red;"></p>
  </div>

  <script>
    const PASSWORD = "yourpassword"; // change to your desired password
    const TARGET = "https://swordoflight2k.github.io/"; // your GitHub Pages homepage

    function checkPassword() {
      const input = document.getElementById('password').value;
      if(input === PASSWORD){
        sessionStorage.setItem('monkeygg2_auth', 'true');
        window.location.href = TARGET;
      } else {
        document.getElementById('error').textContent = "Wrong password!";
      }
    }
  </script>
</body>
</html>
