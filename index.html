  <!-- CSS -->
  <link href="css/loading.css" rel="stylesheet" type="text/css" />
  <link href="css/style.css" rel="stylesheet" type="text/css" />
  
  <style>
    .password-gate {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      flex-direction: column;
      gap: 20px;
    }
    .password-gate h2 {
      color: white;
      font-family: Arial, sans-serif;
    }
    .password-gate input {
      padding: 10px 20px;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 5px;
      outline: none;
    }
    .password-gate input:focus {
      border-color: #4CAF50;
    }
    .password-gate button {
      padding: 10px 30px;
      font-size: 18px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .password-gate button:hover {
      background: #45a049;
    }
    .error-message {
      color: #ff4444;
      display: none;
    }
  </style>
</head>

<body>
  <!-- Password Gate -->
  <div class="password-gate" id="passwordGate">
    <h2>Enter Access Code</h2>
    <input type="text" id="answerInput" placeholder="Enter the answer" />
    <p class="error-message" id="errorMsg">Incorrect answer!</p>
    <button onclick="checkAnswer()">Submit</button>
  </div>

  <noscript>
    <p id="noscript-text">This site requires you to be able to run JavaScript.</p>
  </noscript>
  
  <div class="loading">
    <div>
      <div class="loading-tip"></div>
      <div class="loading-infinity">
        <br />
        <svg class="infinity" viewBox="0 0 256 128" width="256px" height="128px" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#5ebd3e" />
              <stop offset="33%" stop-color="#ffb900" />
              <stop offset="67%" stop-color="#f78200" />
              <stop offset="100%" stop-color="#e23838" />
            </linearGradient>
            <linearGradient id="grad2" x1="1" y1="0" x2="0" y2="0">
              <stop offset="0%" stop-color="#e23838" />
              <stop offset="33%" stop-color="#973999" />
              <stop offset="67%" stop-color="#009cdf" />
              <stop offset="100%" stop-color="#5ebd3e" />
            </linearGradient>
          </defs>
          <g fill="none" stroke-linecap="round" stroke-width="16">
            <g class="track" stroke="rgba(0,0,0,0)">
              <path d="M8,64s0-56,60-56,60,112,120,112,60-56,60-56" />
              <path d="M248,64s0-56-60-56-60,112-120,112S8,64,8,64" />
            </g>
            <g stroke-dasharray="180 656">
              <path class="worm1" stroke="url(#grad1)" stroke-dashoffset="0" d="M8,64s0-56,60-56,60,112,120,112,60-56,60-56" />
              <path class="worm2" stroke="url(#grad2)" stroke-dashoffset="358" d="M248,64s0-56-60-56-60,112-120,112S8,64,8,64" />
            </g>
          </g>
        </svg>
      </div>
    </div>
    <div class="loading-icon">
      <img src="imgs/icon-256-256.png" alt="MonkeyGG2 Icon" />
    </div>
  </div>
  
  <section id="everything-else">
    <!-- Your MonkeyGG2 content goes here -->
    <h1 id="title">MonkeyGG2</h1>
    <p style="color: white; text-align: center; margin-top: 50px;">Site content will be displayed here once you enter the correct answer.</p>
  </section>

 <script>
  function checkAnswer() {
    const userAnswer = document.getElementById('answerInput').value.trim();
    const correctAnswer = "sj.nyc";
    const errorMsg = document.getElementById('errorMsg');

    if (userAnswer !== correctAnswer) {
      errorMsg.style.display = 'block';
      document.getElementById('answerInput').value = '';
      setTimeout(() => {
        window.location.href = "https://unis.org";
      }, 1500);
    } else {
      // Hide password gate and loading screen
      document.getElementById('passwordGate').style.display = 'none';
      document.querySelector('.loading').style.display = 'none';
      document.getElementById('everything-else').style.display = 'block';
    }
  }

  // Allow Enter key to submit
  document.getElementById('answerInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      checkAnswer();
    }
  });

  // Initially hide site content until access granted
  document.getElementById('everything-else').style.display = 'none';
</script>
